<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How vaccines work</title>
<link rel="stylesheet" href="../visual-kit.css">
<script src="../visual-kit.js"></script>
</head>
<body>
<script class="vk" type="application/json">
[
  { "type": "slides", "title": "How vaccines work", "slides": [
    { "layout": "title", "title": "How vaccines train your immune system",
      "body": "The idea, the steps, the main types, and the myths. Use the arrow keys, or the fullscreen button to present." },

    { "title": "The problem",
      "body": "The first time you meet a germ, your immune system needs days to work out how to fight it, and the germ can do harm in the meantime.",
      "blocks": [ { "type": "callout", "kind": "key", "body": "A vaccine lets your body do that learning **safely, in advance**, so the first real meeting is not the first lesson." } ] },

    { "title": "What happens, step by step", "blocks": [
      { "type": "steps", "steps": [
        { "title": "A harmless trigger is introduced", "body": "A weakened or killed germ, a piece of one, or instructions for making a piece." },
        { "title": "Immune cells spot something foreign", "body": "They recognise the piece as not belonging to your body." },
        { "title": "Your body builds a defence", "body": "It makes antibodies and memory cells that remember the target." },
        { "title": "Later, the real germ arrives", "body": "Memory cells recognise it and respond quickly, often before you feel ill." } ] } ] },

    { "title": "First meeting versus a remembered one", "blocks": [
      { "type": "compare", "columns": ["Without memory", "With memory (after vaccination)"], "rows": [
        { "label": "Speed", "values": ["Slow: days to ramp up", "Fast: memory cells are ready"] },
        { "label": "Strength", "values": ["Builds up while the germ spreads", "Strong response straight away"] },
        { "label": "Typical result", "values": ["More chance of serious illness", "Mild illness or none"] } ] } ] },

    { "title": "The main types", "layout": "columns", "blocks": [
      { "type": "cards", "columns": 2, "items": [
        { "tag": "Inactivated", "title": "Killed germ", "body": "Cannot cause the disease. Often needs boosters." },
        { "tag": "Live attenuated", "title": "Weakened germ", "body": "Gives a strong, lasting response. Not suitable for everyone." },
        { "tag": "Subunit", "title": "A piece only", "body": "Just the part the immune system needs to see." },
        { "tag": "Newer", "title": "mRNA: instructions", "body": "Cells briefly make one harmless protein, which trains the immune system." } ] } ] },

    { "title": "Myths and what is true", "blocks": [
      { "type": "compare", "columns": ["Myth", "What is true"], "rows": [
        { "label": "Disease", "values": ["A vaccine gives you the disease", "It contains none of it, or a weakened or harmless part that cannot cause the full illness"] },
        { "label": "Natural immunity", "values": ["Catching it is always better", "You face the illness and its risks first"] },
        { "label": "Side effects", "values": ["A sore arm means something is wrong", "It is usually the immune system responding, and it passes quickly"] } ] } ] },

    { "title": "Protecting people who can’t be vaccinated",
      "body": "When enough people are immune, a germ struggles to find new people to infect. This is called **herd protection**, and it shields babies and people whose immune systems are weak.",
      "blocks": [ { "type": "callout", "kind": "tip", "body": "Your vaccination helps you and the people around you." } ] },

    { "layout": "title", "title": "In one line",
      "body": "Vaccines teach your immune system to recognise a germ **before** it meets the real thing." }
  ] }
]
</script>
</body>
</html>
